<script>
(function(){
const $=id=>document.getElementById(id),NCOIN=420,DECK=3.5;let FIN=3040;
const sm=(z,a,b)=>{const t=Math.min(1,Math.max(0,(z-a)/(b-a)));return t*t*(3-2*t)};

let TARGET=80,CF=LV[0],RT={id:0,z0:0,len:3040},built=false,builtC=false,builtO=false;
const RFZ=[[40,170],[400,550],[760,900],[1310,2040],[2150,2450],[3500,3750],[4000,4250],[8100,8400],[10700,10900],[12050,12300],[12600,12900]];

// ---------- AUDIO ----------
let ac=null,eng=null,gE=null;

 wnd=mk('lowpass',400);fallG=mk('bandpass',700);}
function sfx(dt){const K=S.keys;

 if(S.pg&&!K.gas&&S.speed>16&&!S.paused)blip('sawtooth',100,40,1,.1,.12);S.pg=K.gas;
 if(BS.on){S.rt2=(S.rt2||0)-dt;if(S.rt2<=0){S.rt2=.14;blip('square',70,45,1,.04,.1);}}

function ambient(dt){if(!ac||ac.state!=='running'||!wnd)return;const t=ac.currentTime;

 let dn=999;for(const q of WFS)dn=Math.min(dn,Math.abs(S.z-q.z));fallG.g.gain.setTargetAtTime(S.paused?0:Math.max(0,1-dn/50)*.09,t,.3);
 if(S.paused)return;S.bt=(S.bt||0)-dt;if(S.bt<=0){S.bt=rnd(2.5,6);const zi=zoneAt(S.z);if(zi===0||zi===1||zi===5||zi===8||zi===18){blip('sine',rnd(2200,2800),rnd(3200,3800),1,.04,.12);setTimeout(()=>blip('sine',2600,3600,1,.04,.1),150);}}
 S.bl=(S.bl||0)-dt;if(S.bl<=0&&S.z>190&&S.z<275){S.bl=7;blip('sine',523,500,1,.1,1.4);blip('sine',1046,1000,1,.04,1);}S.fd=(S.fd||0)-dt;if(S.fd<=0&&S.z>560&&S.z<740){S.fd=.5;blip('triangle',150,55,1,.3,.2);}sfx(dt);}
function blip(t,f1,f2,m,v,d){if(!ac||ac.state!=='running')return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f1,n);if(m)o.frequency.exponentialRampToValueAtTime(f2,n+d);else o.frequency.setValueAtTime(f2,n+.08);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);}

// ---------- WORLD FUNCTIONS ----------
const WFS=[{z:60,s:1},{z:800,s:-1}],FORDS=[8420,8800];
const cxA=z=>(Math.sin(z*.02)*3+Math.cos(z*.01)*2)*(1-sm(z,905,940))+sm(z,395,425)*(1-sm(z,525,550))*5*Math.sin((z-410)*.04)+sm(z,1085,1115)*(1-sm(z,1270,1290))*7*Math.sin((z-1085)*.04)+sm(z,1290,1315)*(1-sm(z,1480,1500))*9*Math.sin((z-1290)*.075)+sm(z,1500,1530)*(1-sm(z,2040,2070))*16*Math.sin((z-1500)*.042)+sm(z,2110,2140)*(1-sm(z,2470,2500))*12*Math.sin((z-2110)*.04);
const cx=z=>z>=16400?cxC(z):z>=13300?cxR(z):z>=10480?cxO(z):z>7700?cxE(z):z>3250?cxD(z):cxA(z),cxD=z=>sm(z,3300,3340)*(1-sm(z,4660,4740))*(8*Math.sin((z-3300)*.02)+5*Math.sin((z-3300)*.05));
const mx=(a,b,t)=>a+(b-a)*t;
const mt=z=>.3*sm(z,380,440)*(1-sm(z,545,585)),ct=z=>sm(z,555,575)*(1-sm(z,735,755)),jg=z=>sm(z,735,755)*(1-sm(z,905,935)),fl=z=>sm(z,1085,1110)*(1-sm(z,1280,1300)),sn=z=>sm(z,1290,1330)*(1-sm(z,2060,2100));
const hw=z=>z>=16400?hwC(z):z>=13300?hwR(z):3.8+1.2*ct(z)-.5*jg(z)+1.7*sm(z,925,950)*(1-sm(z,1085,1110))-.8*sn(z)+1.5*sm(z,2500,2530)-(z>7700?(1.9*(1-sm(z,9060,9120))-1.2*sm(z,9060,9120)):0);
const bw=z=>sm(z,285,310)*(1-sm(z,370,395));
const RA=[90,140,215,405,555,625,700,790,860,1150,1235,1360,2250,2420,2620],RB=[3420,3600,3880,4150,4400,5100,5600,6200],RC=[8200,8500,8750,8950,9300,9700,10000],RD=[10760,11330,12030,12380],RAMPS=RA.concat(RB,RC,RD);
const RH=2.2,RL=7;
function ramp(x,z){for(const r of RAMPS){const d=z-r;if(d>0&&d<RL&&Math.abs(x-cx(z))<3.2)return RH*d/RL;}return 0}
var BEDS=null;function initBeds(){if(!BEDS)BEDS=[470,1190,2650].map(z=>{const c=cx(z);return{z,c,y:ghRaw(c,z)};});return BEDS;}
function gh(x,z){let h=(z>=16400)?gC(x,z):(z>=13300)?gR(x,z):ghRaw(x,z);for(const b of initBeds()){const w=(1-sm(Math.abs(z-b.z),3.2,4.8))*(1-sm(Math.abs(x-b.c),190,215));if(w>0)h+=(b.y-h)*w;}return h;}
function ghRaw(x,z){if(z>=16400)return gC(x,z);if(z>=13300)return gR(x,z);if(z>=10480)return gO(x,z);if(z>7700)return gEr(x,z);if(z>3250)return gD(x,z);
  const rx=x-cx(z),ar=Math.abs(rx);
  const amp=(1-.6*sm(z,150,190)*(1-sm(z,290,310)))*(1-.8*ct(z))*(1-.85*sm(z,925,950)*(1-.6*sm(z,1085,1110)))*(1+.4*sn(z))*(1-.8*sm(z,2480,2520));

  for(const q of WFS){const u=q.s*rx,v=sm(z,q.z-20,q.z-8)*(1-sm(z,q.z+8,q.z+20));h+=14*v*sm(u,8,14)*(1-sm(u,27,34));}

}
const surf=(x,z)=>gh(x,z)+ramp(x,z);
const ZN=['Green Hills','Village · Chandanpur','Mahanadi Bridge','Mountain Road','Kataka','Jungle','Scenic Highway','Mountain Road','Rice Fields','Snowy Pass','Summit Climb','Valley Descent','Coastal Highway','Dune Sea','Red Canyon','Oasis Fort','Coconut Highway','Banana Grove','Saratola','Valley Off-Road','Metro City','Chilika Lake','Konark Coast','Simlipal Forest','Hirakud Dam','Puri Beach','Cuttack City','Netaji Setu Bridge','NH-16 Highway','Badambadi Flyover','Bhubaneswar City','Bhubaneswar–Pipili Bypass','Pipili Village Road','Puri Highway','Puri City'];
const zoneAt=z=>z>=16400?zoneC(z):z>=13300?26+r4i(z):z>=10480?(z<11180?21:z<11930?22:z<12480?23:z<13000?24:25):z>7700?(z<9100?19:20):z>3250?(z<3800?13:z<4250?14:z<4760?15:z<6770?16:17):z<170?0:z<285?1:z<395?2:z<410?3:z<545?7:z<560?3:z<740?4:z<920?5:z<1085?6:z<1210?8:z<1290?18:z<1500?9:z<2100?10:z<2500?11:12;

// ---------- RENDERER / SCENE ----------
const box=$('game'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,70,200);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));

// water
const rvc=document.createElement('canvas');rvc.width=rvc.height=128;const rvx=rvc.getContext('2d');rvx.fillStyle='#2f86c4';rvx.fillRect(0,0,128,128);
for(let i=0;i<70;i++){rvx.strokeStyle='rgba(210,240,255,'+rnd(.12,.45)+')';rvx.lineWidth=rnd(1,2.4);const x0=rnd(0,128),y0=rnd(0,128),w0=rnd(6,22);rvx.beginPath();rvx.moveTo(x0,y0);rvx.quadraticCurveTo(x0+w0/2,y0-3,x0+w0,y0);rvx.stroke();}
const rivTex=new THREE.CanvasTexture(rvc);rivTex.wrapS=rivTex.wrapT=THREE.RepeatWrapping;rivTex.repeat.set(8,8);
